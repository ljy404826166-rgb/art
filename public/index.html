<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17324d" />
    <meta
      name="description"
      content="艺藏 Art Archive 是一个用于欣赏、下载和学习公开领域绘画艺术品的移动端优先资源库。"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css?v=figma1" />
    <title>艺藏 Art Archive</title>
  </head>
  <body>
    <div id="app">
      <header class="app-shell">
        <div class="topbar">
          <button class="back-button" type="button" aria-label="返回">
            <span aria-hidden="true">‹</span>
          </button>
          <strong class="screen-title">画廊</strong>
          <div class="nav-actions">
            <button class="icon-button" id="installButton" type="button" hidden aria-label="安装应用">
              <span aria-hidden="true">⇩</span>
            </button>
            <button class="icon-button" id="favoritesButton" type="button" aria-label="查看收藏">
              <span aria-hidden="true">♡</span>
            </button>
          </div>
        </div>

        <nav class="main-nav" aria-label="应用主导航">
          <button class="main-nav-item" type="button" data-view-target="home" aria-pressed="true">首页</button>
          <button class="main-nav-item" type="button" data-view-target="categories" aria-pressed="false">分类</button>
          <button class="main-nav-item" type="button" data-view-target="me" aria-pressed="false">我的</button>
        </nav>
      </header>

      <main>
        <section class="status-band" id="statusBand" hidden></section>

        <section class="view-section" id="homeView" data-view-section="home">
          <div class="pull-refresh-indicator" id="pullRefreshIndicator" data-state="idle" aria-hidden="true">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle class="pull-refresh-track" cx="20" cy="20" r="15.5" pathLength="100"></circle>
              <circle class="pull-refresh-progress" cx="20" cy="20" r="15.5" pathLength="100"></circle>
            </svg>
          </div>

          <section class="home-search app-shell" aria-label="搜索作品">
            <label class="search-field">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="星月夜" autocomplete="off" />
              <button class="filter-button" type="button" aria-label="筛选">
                <span aria-hidden="true">☷</span>
              </button>
            </label>
            <div class="home-facets" id="movementFilters" aria-label="首页推荐维度"></div>
          </section>

          <section class="app-shell recommendation-section" id="gallery">
            <button class="refresh-link" id="refreshButton" type="button">刷新推荐</button>
            <div class="recommendation-feed" id="galleryGrid" aria-live="polite"></div>
          </section>
        </section>

        <section class="view-section app-shell" id="categoriesView" data-view-section="categories" hidden>
          <div class="page-heading">
            <p class="eyebrow">Categories</p>
            <h1>按标签分类</h1>
            <p>从流派、主题和来源标签进入作品库，适合快速发现同类画作。</p>
          </div>
          <div class="category-grid" id="categoryGrid" aria-label="标签列表"></div>
          <div class="section-heading category-results-heading">
            <div>
              <p class="eyebrow" id="categoryResultEyebrow">Tagged artworks</p>
              <h2 id="categoryResultTitle">选择一个标签</h2>
            </div>
          </div>
          <div class="gallery-grid" id="categoryResults" aria-live="polite"></div>
        </section>

        <section class="view-section app-shell" id="meView" data-view-section="me" hidden>
          <div class="profile-hero">
            <div class="avatar" aria-hidden="true">艺</div>
            <div>
              <p class="eyebrow">My archive</p>
              <h1>我的</h1>
              <p>管理收藏、查看资料库状态，并为未来账号、下载记录和学习足迹预留入口。</p>
            </div>
          </div>

          <div class="profile-grid">
            <article class="profile-panel">
              <span class="metric" id="favoriteCount">0</span>
              <h2>我的收藏</h2>
              <p>收藏会保存在当前设备，接入 Supabase Auth 后可同步到账号。</p>
              <button class="text-button" id="showFavoriteButton" type="button">查看收藏作品</button>
            </article>
            <article class="profile-panel">
              <span class="metric" id="libraryCount">0</span>
              <h2>资料库</h2>
              <p id="librarySourceText">当前使用本地种子库。</p>
              <button class="text-button" id="profileRefreshButton" type="button">同步资料库</button>
            </article>
            <article class="profile-panel">
              <span class="metric">Soon</span>
              <h2>账号与下载</h2>
              <p>这里将承载登录、下载历史、隐私设置和会员功能。</p>
            </article>
          </div>

          <section class="favorites-section">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Favorites</p>
                <h2>收藏作品</h2>
              </div>
            </div>
            <div class="gallery-grid" id="favoriteGrid" aria-live="polite"></div>
          </section>
        </section>
      </main>

      <aside class="drawer" id="detailDrawer" aria-hidden="true" aria-labelledby="drawerTitle">
        <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="关闭详情"></button>
        <article class="drawer-card">
          <button class="icon-button drawer-close" id="drawerClose" type="button" aria-label="关闭">
            <span aria-hidden="true">×</span>
          </button>
          <img id="drawerImage" alt="" />
          <div class="drawer-content">
            <p class="eyebrow" id="drawerMovement"></p>
            <h2 id="drawerTitle"></h2>
            <p id="drawerMeta"></p>
            <p id="drawerSummary"></p>
            <div class="note-list" id="drawerNotes"></div>
            <div class="drawer-actions">
              <a class="primary-button" id="downloadLink" href="#" target="_blank" rel="noreferrer">下载高清图</a>
              <a class="text-button" id="sourceLink" href="#" target="_blank" rel="noreferrer">查看来源</a>
            </div>
          </div>
        </article>
      </aside>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/src/app.js?v=figma1"></script>
  </body>
</html>
