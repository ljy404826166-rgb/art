name: PR quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run format, lint, type, unit, Node, E2E, build, and miniapp static gates
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run verify 2>&1 | tee artifacts/ci/verify.log
      - name: Archive quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-${{ github.run_attempt }}
          path: |
            artifacts/ci/
            playwright-report/
            test-results/
            dist/
          if-no-files-found: ignore
          retention-days: 14
