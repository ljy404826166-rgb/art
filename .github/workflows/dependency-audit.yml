name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Reject high and critical production vulnerabilities
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee artifacts/ci/production-audit.log
      - name: Archive dependency audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: artifacts/ci/production-audit.log
          if-no-files-found: error
          retention-days: 30
